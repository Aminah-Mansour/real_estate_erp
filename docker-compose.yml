# Local development database only (development data). Created and configured by scripts/dev_setup.sh.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_PASSWORD: ${ERP_DEV_POSTGRES_PASSWORD:?run scripts/dev_setup.sh first}
    ports:
      - "127.0.0.1:${ERP_DEV_DB_PORT:-5433}:5432"
    volumes:
      - erp_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  erp_dev_db:
